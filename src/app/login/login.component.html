<main class="auth-page">
  <section class="auth-card">
    <a class="brand" routerLink="/">railwise <small>ticket desk</small></a>
    <p class="eyebrow">Secure passenger access</p>
    <h1>Welcome back</h1>
    <p class="intro">Log in to search trains, book journeys, and manage your tickets.</p>
    <form (ngSubmit)="login()">
      <label>Email<input name="email" type="email" [(ngModel)]="email" autocomplete="email" required></label>
      <div class="password-field">
        <label for="login-password">Password</label>
        <span class="password-input-wrapper">
          <input id="login-password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" autocomplete="current-password" required>
          <button class="password-toggle" type="button" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword" (click)="showPassword = !showPassword">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path *ngIf="!showPassword" d="m4 4 16 16"></path></svg>
          </button>
        </span>
      </div>
      <button class="primary-button" type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Signing in...' : 'Sign in' }}</button>
    </form>
    <p class="message error" *ngIf="message">{{ message }}</p>
    <div class="auth-links"><a routerLink="/register">Create an account</a><a routerLink="/forgot-password">Forgot password?</a></div>
  </section>
</main>
