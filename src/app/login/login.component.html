<main class="auth-page">
  <section class="auth-card">
    <a class="brand" routerLink="/">railwise <small>ticket desk</small></a>
    <p class="eyebrow">Secure passenger access</p>
    <h1>Welcome back</h1>
    <p class="intro">Log in to search trains, book journeys, and manage your tickets.</p>
    <form (ngSubmit)="login()">
      <label>Email<input name="email" type="email" [(ngModel)]="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required></label>
      <button class="primary-button" type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Signing in...' : 'Sign in' }}</button>
    </form>
    <p class="message error" *ngIf="message">{{ message }}</p>
    <div class="auth-links"><a routerLink="/register">Create an account</a><a routerLink="/forgot-password">Forgot password?</a></div>
  </section>
</main>
