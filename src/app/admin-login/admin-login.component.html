<main class="admin-login-page">
  <app-header variant="home"></app-header>
  <div class="auth-content">
    <section class="admin-login-card">
      <span class="role-label">Restricted administrator access</span>
      <h1>Control room</h1>
      <p>Sign in to monitor all tickets and publish train schedules.</p>
      <form (ngSubmit)="login()">
        <label>Administrator email<input name="email" type="email" [(ngModel)]="email" autocomplete="username" required></label>
        <div class="password-field">
          <label for="admin-login-password">Administrator password</label>
          <span class="password-input-wrapper">
            <input id="admin-login-password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword" (click)="showPassword = !showPassword">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path *ngIf="!showPassword" d="m4 4 16 16"></path></svg>
            </button>
          </span>
        </div>
        <button type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Verifying...' : 'Enter control room' }}</button>
      </form>
      <p class="message" *ngIf="message">{{ message }}</p>
      <div class="links"><a routerLink="/user-login">User login</a><a routerLink="/">Back to home</a></div>
    </section>
  </div>
</main>
