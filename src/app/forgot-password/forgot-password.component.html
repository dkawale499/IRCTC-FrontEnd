<main class="auth-page"><section class="auth-card"><a class="brand" routerLink="/">railwise <small>ticket desk</small></a><p class="eyebrow">Account recovery</p><h1>Reset password</h1><p class="intro">Request a reset token, then choose a new password.</p><form (ngSubmit)="requestToken()"><label>Email<input name="email" type="email" [(ngModel)]="email" required></label><button class="primary-button" type="submit">Create reset token</button></form><form *ngIf="token" (ngSubmit)="reset()"><label>Reset token<input name="token" [(ngModel)]="token" required></label><label>New password<input name="newPassword" type="password" [(ngModel)]="newPassword" required></label><button class="primary-button" type="submit">Reset password</button></form><p class="message">{{ message }}</p><p class="auth-links"><a routerLink="/login">Back to login</a></p></section></main>
