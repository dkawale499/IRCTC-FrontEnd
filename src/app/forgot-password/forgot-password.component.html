<main class="auth-page">
  <app-header variant="home"></app-header>
  <div class="auth-content">
    <section class="auth-card">
      <p class="eyebrow">Account recovery</p>
      <h1>Reset password</h1>
      <p class="intro">Request a reset token, then choose a new password.</p>
      <form (ngSubmit)="requestToken()">
        <label>Email<input name="email" type="email" [(ngModel)]="email" required></label>
        <button class="primary-button" type="submit">Create reset token</button>
      </form>
      <form *ngIf="token" (ngSubmit)="reset()">
        <label>Reset token<input name="token" [(ngModel)]="token" required></label>
        <div class="password-field">
          <label for="reset-new-password">New password</label>
          <span class="password-input-wrapper">
            <input id="reset-new-password" name="newPassword" [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="newPassword" autocomplete="new-password" required>
            <button class="password-toggle" type="button" [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showNewPassword" (click)="showNewPassword = !showNewPassword">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path *ngIf="!showNewPassword" d="m4 4 16 16"></path></svg>
            </button>
          </span>
        </div>
        <button class="primary-button" type="submit">Reset password</button>
      </form>
      <p class="message">{{ message }}</p>
      <p class="auth-links"><a routerLink="/login">Back to login</a></p>
    </section>
  </div>
</main>
