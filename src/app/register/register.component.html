<main class="auth-page">
  <app-header variant="home"></app-header>
  <div class="auth-content">
    <section class="auth-card">
      <p class="eyebrow">Passenger registration</p>
      <h1>Create account</h1>
      <p class="intro">Create your secure IRCTC ticket desk account and receive a ₹100 wallet bonus.</p>
      <form (ngSubmit)="register()">
        <label>Full name<input name="fullName" [(ngModel)]="fullName" autocomplete="name" required></label>
        <label>Email<input name="email" type="email" [(ngModel)]="email" autocomplete="email" required></label>
        <label>Phone<input name="phone" type="tel" [(ngModel)]="phone" autocomplete="tel" required></label>
        <div class="password-field">
          <label for="register-password">Password</label>
          <span class="password-input-wrapper">
            <input id="register-password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" autocomplete="new-password" minlength="8" required>
            <button class="password-toggle" type="button" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword" (click)="showPassword = !showPassword">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path *ngIf="!showPassword" d="m4 4 16 16"></path></svg>
            </button>
          </span>
        </div>
        <button class="primary-button" type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Creating account...' : 'Create account' }}</button>
      </form>
      <p class="message error" *ngIf="message">{{ message }}</p>
      <p class="auth-links"><a routerLink="/login">Already have an account? Sign in</a></p>
    </section>
  </div>
</main>
