<main class="auth-page">
  <section class="auth-card">
    <a class="brand" routerLink="/">railwise <small>ticket desk</small></a>
    <p class="eyebrow">Passenger registration</p>
    <h1>Create account</h1>
    <p class="intro">Create your secure IRCTC ticket desk account and receive a ₹100 wallet bonus.</p>
    <form (ngSubmit)="register()">
      <label>Full name<input name="fullName" [(ngModel)]="fullName" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" [(ngModel)]="email" autocomplete="email" required></label>
      <label>Phone<input name="phone" type="tel" [(ngModel)]="phone" autocomplete="tel" required></label>
      <label>Password<input name="password" type="password" [(ngModel)]="password" autocomplete="new-password" minlength="8" required></label>
      <button class="primary-button" type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Creating account...' : 'Create account' }}</button>
    </form>
    <p class="message error" *ngIf="message">{{ message }}</p>
    <p class="auth-links"><a routerLink="/login">Already have an account? Sign in</a></p>
  </section>
</main>
